<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理端 · AI 设置</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="logo">🩺</div>
        <div class="brand-text"><b>教学管理平台</b><span>AI 模拟患者系统</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group-label">管理</div>
        <a href="admin-dashboard.html" data-page="dashboard"><span class="nav-ico">📊</span>仪表盘</a>
        <a href="admin-apikey.html" data-page="apikey"><span class="nav-ico">🔑</span>API Key</a>
        <a href="admin-ai-settings.html" data-page="ai"><span class="nav-ico">⚙️</span>AI 设置</a>
        <a href="admin-cases.html" data-page="cases"><span class="nav-ico">🗂️</span>病例审核</a>
        <a href="admin-stats.html" data-page="stats"><span class="nav-ico">📈</span>统计</a>
        <div class="nav-group-label">其它端口</div>
        <a href="student-diagnosis.html"><span class="nav-ico">🧑‍⚕️</span>学生端</a>
        <a href="hospital.html"><span class="nav-ico">🏥</span>医院端</a>
        <a href="index.html"><span class="nav-ico">🏠</span>返回首页</a>
      </nav>
      <div class="sidebar-footer">数据存于浏览器 localStorage</div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="flex gap-2" style="align-items:center;">
          <button class="menu-toggle">☰</button>
          <div class="topbar-title">⚙️ 管理端 · AI 调用设置</div>
        </div>
        <div class="topbar-actions"><a class="btn btn-ghost btn-sm" href="index.html">首页</a></div>
      </header>

      <div class="content-scroll">
        <div class="content-wrap">
          <div class="grid-2">
            <div class="card">
              <h2 style="font-size:18px;margin-bottom:12px;">提示词与扮演要求</h2>
              <div class="field">
                <label>系统提示词</label>
                <textarea class="textarea" id="systemPrompt" style="min-height:110px;"></textarea>
              </div>
              <div class="field">
                <label>患者扮演要求</label>
                <textarea class="textarea" id="patientPrompt" style="min-height:90px;"></textarea>
              </div>
              <div class="field">
                <label>医患沟通与人文关怀要求</label>
                <textarea class="textarea" id="humanisticPrompt" style="min-height:80px;"></textarea>
              </div>
            </div>

            <div class="card">
              <h2 style="font-size:18px;margin-bottom:12px;">生成参数与限制</h2>
              <div class="field-row">
                <div class="field">
                  <label>英文外国患者概率 (0~1)</label>
                  <input class="input" type="number" id="englishProb" min="0" max="1" step="0.05" />
                  <div class="field-hint">默认 0.1（10%），每次诊断随机决定是否英文交流。</div>
                </div>
                <div class="field">
                  <label>温度 Temperature</label>
                  <input class="input" type="number" id="temperature" min="0" max="2" step="0.1" />
                </div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label>单次最大 Token</label>
                  <input class="input" type="number" id="maxTokens" min="100" step="100" />
                </div>
                <div class="field">
                  <label>每日 Token 上限</label>
                  <input class="input" type="number" id="dailyToken" min="1000" step="1000" />
                  <div class="field-hint">累计用量超限将阻止调用并提示。</div>
                </div>
              </div>

              <div class="setting-row">
                <div class="setting-label">
                  <b>启用演示模式</b>
                  <span>无 Key / 停止调用时回退到模拟患者</span>
                </div>
                <label class="switch">
                  <input type="checkbox" id="demoMode" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="card mt-4">
            <h2 style="font-size:18px;margin-bottom:4px;">积分规则（默认值）</h2>
            <p class="text-muted text-sm mb-4">诊断与做题的加分 / 扣分基准，学生端实时累计。</p>
            <div class="grid-4">
              <div class="field"><label>诊断正确 +</label><input class="input" type="number" id="pt_diagCorrect" /></div>
              <div class="field"><label>诊断错误</label><input class="input" type="number" id="pt_diagWrong" /></div>
              <div class="field"><label>人文优秀 +</label><input class="input" type="number" id="pt_empathyGood" /></div>
              <div class="field"><label>缺乏人文</label><input class="input" type="number" id="pt_empathyPoor" /></div>
              <div class="field"><label>选择题对 +</label><input class="input" type="number" id="pt_quizCorrect" /></div>
              <div class="field"><label>选择题错</label><input class="input" type="number" id="pt_quizWrong" /></div>
              <div class="field"><label>简答题完成 +</label><input class="input" type="number" id="pt_quizShortDone" /></div>
            </div>
            <div class="flex gap-2 mt-3">
              <button class="btn btn-primary" id="btnSaveAi">保存 AI 设置</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mock-ai.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/shell.js"></script>
  <script>AIPS.admin.initAiSettings();</script>
</body>
</html>
